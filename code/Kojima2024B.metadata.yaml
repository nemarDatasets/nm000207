abstract: 'The ASME (Auditory Stream segregation Multiclass ERP) paradigm is used for an auditory brain-computer interface
  (BCI). Two approaches for achieving four-class ASME were investigated: ASME-4stream (four streams with a single target stimulus
  each) and ASME-2stream (two streams with two target stimuli each). Fifteen healthy subjects participated. ERPs were analyzed,
  and binary classification and BCI simulation were conducted offline using linear discriminant analysis. Average accuracies
  were 0.83 (ASME-4stream) and 0.86 (ASME-2stream). The ASME-2stream paradigm showed shorter latency and larger amplitude
  of P300, higher binary classification accuracy, and smaller workload. Both paradigms achieved sufficiently high accuracy
  (over 80%) for practical auditory BCI.'
